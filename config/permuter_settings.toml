compiler_type = "gcc"
compiler_command = "mipsel-linux-gnu-cpp -Iinclude -Iinclude/psxsdk -undef -Wall -fno-builtin -Dmips -D__GNUC__=2 -D__OPTIMIZE__ -D__mips__ -D__mips -Dpsx -D__psx__ -D__psx -D_PSYQ -D__EXTENSIONS__ -D_MIPSEL -D_LANGUAGE_C -DLANGUAGE_C -DNO_LOGS -DHACKS -DUSE_INCLUDE_ASM -D_internal_version_us -DSOTN_STR -lang-c | ./tools/sotn_str/target/release/sotn_str process | iconv --from-code=UTF-8 --to-code=Shift-JIS | ./bin/cc1-psx-26 -G0 -w -O2 -funsigned-char -fpeephole -ffunction-cse -fpcc-struct-return -fcommon -fverbose-asm -msoft-float -g -quiet -mcpu=3000 -fgnu-linker -mgas -gcoff | python3 tools/maspsx/maspsx.py --expand-div --aspsx-version=2.34 | mipsel-linux-gnu-as -Iinclude -march=r3000 -mtune=r3000 -no-pad-sections -O1 -G0"
assembler_command = "mipsel-linux-gnu-as -Iinclude -march=r3000 -mtune=r3000 -no-pad-sections -O1 -G0"
asm_prelude_file = "include/main.inc"

[decompme.compilers]
"mipsel-linux-gnu-cpp" = "psyq4.0"

# Macros the permuter should keep INTACT instead of expanding.
#
# Without this table every import printed "Preserving no macros", and the
# permuter saw FIX(0.5) as ((s32)((0.5) * 65536.0)). Two costs:
#   1. Output quality. The permuter emits what it mutated, so a match came back
#      with the expansion inlined -- which automation/quality_audit.py then
#      flags as a magic number. Preserving the macro keeps the idiom.
#   2. Search space. default_weights.toml sets perm_temp_for_expr = 100, the
#      single heaviest weight, so the permuter spends its budget hoisting parts
#      of an expression into temporaries. Every one of those attempts on a
#      constant-folding macro is wasted work.
#
# Each key is a regex (anchored by import.py as ^(?:key)$) and each value is the
# C type of the result. import.py emits `<type> <NAME>();` -- K&R, no parameter
# list -- so arity does not matter and COLOR16's four arguments are fine.
#
# LOW and LOH are DELIBERATELY ABSENT. A preserved macro becomes a function
# call, and a function call cannot be an assignment target. Measured over
# src/**/*.{c,h}: LOW is written to 921 times and LOH 253 times, e.g.
# `LOW(entity->posX) = ...`. Preserving either would turn every one of those
# into `LOW(...) = x`, which is not valid C. No other macro in this list is
# ever an assignment target -- all 11 were checked, and the other nine are
# rvalue-only.
[preserve_macros]
# VALUES MUST BE BUILTIN C TYPES, never project typedefs.
#
# import.py emits these as `<type> <NAME>();` into a block it places at the TOP
# of base.c, ABOVE the typedef section. So `s32 FIX();` lands at line 6 while
# `typedef signed int s32;` is at line 24, and pycparser has never heard of s32
# when it gets there. The whole import then dies with a bare
# "Syntax error in base.c." that names neither the macro nor the type.
#
# Observed 2026-08-03 on BO6_AguneaShuffleParams, which failed every permuter
# run for exactly this reason while older work dirs, imported before this table
# existed, kept working. That split is the tell: if a new import breaks and old
# ones do not, suspect this table.
#
# The spellings below are the same types the typedefs resolve to, so nothing
# changes semantically:
#   s32 = signed int      -> int
#   s16 = signed short    -> short
#   u16 = unsigned short  -> unsigned short
"FIX" = "int"                      # ((s32)((x) * 65536.0))  fixed-point literal
"FLT" = "int"                      # ((s32)((x) * 4096.0))
"ROT" = "int"                      # ((s32)(FLT(x) / 360))
"FLT_TO_I" = "int"                 # ((s32)(x) >> 12)
"LEN" = "int"                      # sizeof(x)/sizeof(*(x)), folds at compile time
"CH" = "int"                       # ((x) - 0x20), character-table index
"_S" = "int"                       # identity; marks a sound id, worth keeping
"COLOR16" = "unsigned short"       # (r) + ((g)<<5) + ((b)<<10) + ((a)<<15)
"PAL_FLAG" = "unsigned short"      # ((x) | PAL_UNK_FLAG)

# LOW and LOH remain DELIBERATELY ABSENT. A preserved macro becomes a function
# call, and a function call cannot be an assignment target. Measured over
# src/**/*.{c,h}: LOW is written to 921 times and LOH 253 times, e.g.
# `LOW(entity->posX) = ...`. Preserving either would turn every one of those
# into invalid C. No other macro here is ever an assignment target.
