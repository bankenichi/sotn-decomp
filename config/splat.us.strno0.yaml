options:
  platform: psx
  basename: strno0
  base_path: ..
  build_path: build/us
  target_path: disks/us/ST/RNO0/RNO0.BIN
  asm_path: asm/us/st/rno0
  asset_path: assets/st/rno0
  src_path: src/st/rno0
  ld_script_path: build/us/strno0.ld
  compiler: GCC
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.us.strno0.txt
  undefined_funcs_auto_path: build/us/config/undefined_funcs_auto.us.strno0.txt
  undefined_syms_auto_path: build/us/config/undefined_syms_auto.us.strno0.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: true
  asm_jtbl_label_macro: jlabel
  symbol_name_format: us_$VRAM
  disassemble_all: true
  section_order:
    - .data
    - .rodata
    - .text
    - .bss
    - .sbss
  ld_bss_is_noload: false
  disasm_unknown: true
  global_vram_start: 0x80010000
  ld_generate_symbol_per_data_segment: true
sha1: 125003c7fe5d3510fddee22d4f5e5390fe507acf
segments:
  - name: strno0
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .data, header]
      - [0x2C, data]
      - [0x8FC, .data, e_init]
      - [0xC18, .data, e_room_bg]
      - [0xE20, data]
      # entity_lock_camera.h's three statics. Start 0xE50 is the minimum data
      # address e_lock_camera's own assembly references, and its refs at 0xE50,
      # 0xE58 and 0xE60 are 8 bytes apart, matching hitbox / data[8] / tilemap
      # props. 0x80 is the size 20 of 27 peers use.
      #
      # NOTE the header is entity_lock_camera.h, NOT e_lock_camera.h. All 20
      # shimming stages name the FILE e_lock_camera.c while including the other
      # header, which is exactly what the old shimmed_by filename rule could not
      # see. Their c segments are 0x1BC, byte-identical to rno0's.
      - [0xE50, .data, e_lock_camera]   # 0x80
      - [0xED0, data]
      # Located by automation/find_data_segment.py, which calibrates against a
      # peer whose address its config already declares before trusting a hit.
      # Cross-check: st_update 0x1048..0x1094, collision 0x1094..0x1454 and
      # e_red_door 0x1454 tile with no gaps, in `c` segment order.
      - [0x1048, .data, st_update]    # 0x4C
      # collision.h's g_testCollEnemyLookup / g_testCollLuckCutoff. Selected by
      # VERSION rather than by stage, hence identical in every us overlay and
      # cleanly calibrated against cen, dre and lib.
      - [0x1094, .data, collision]    # 0x3C0, abuts e_red_door at 0x1454
      # g_eRedDoorUV, 3 rows of 8 bytes. `static` in src/st/e_red_door.h, so
      # the compiled e_red_door.c must emit it and splat must NOT. Located by
      # searching RNO0.BIN for the initialiser's 24-byte signature; the same
      # search on RCEN.BIN returns 0xE78, which is what rcen's config already
      # declares, so the method was validated against a known answer first.
      # EntityRedDoor.s independently references D_us_80181454.
      - [0x1454, .data, e_red_door]   # 0x18
      # st_common.h's g_SineTable: 256 s16 entries = 0x200, the only real data
      # the header emits (D_80180A94 above it is inside a comment block). All 27
      # peers declare this segment; rno0 did not, because it carried a private
      # 713-line copy of st_common with `extern s16 g_SineTable[]` instead.
      #
      # Verified three ways, not inferred: the nine leading halfwords at 0x146C
      # are 0x0000 0x0065 0x00C9 0x012D 0x0191 0x01F5 0x0259 0x02BC 0x031F,
      # byte-identical to the header's initialiser; the size is exactly the
      # 0x200 by which the overlay overran when the shim was first tried without
      # this segment; and 0x146C + 0x200 = 0x166C leaves e_collect 0x166C..0x19C0
      # = 0x354, which is precisely the size 16 peers declare for e_collect.
      - [0x146C, .data, st_common]       # 0x200
      - [0x166C, data]
      # e_misc, shimmed 2026-08-02. Start 0x19C0 is the minimum data address its
      # own assembly references, by the rule validated on e_particles and
      # e_medusa_head. End 0x1A74 is confirmed by a symbol: D_us_80181A74 is
      # e_background_pillars', so the boundary is not inferred, it is named.
      #
      # RETRACTION. The note that stood here said rno0's 0xB4 was "4 bytes
      # smaller than any variant the header can produce" and called this a
      # header change rather than a config change. That was wrong, and it
      # ring-fenced 14 stubs as impossible for a day.
      #
      # cat and lib also declare 0xB4, and both plain-shim e_misc.h with no
      # extra defines, which alone disproves "no variant can produce it". The
      # mechanism is g_QuadIndices2 at e_misc.h:790: it emits a trailing `0, 0`
      # (two s16, exactly the 4 bytes in question) unless the stage is in an
      # exclusion list that already contained NZ0, NO1, CHI, ST0, LIB and CAT.
      # rno0 belongs in that list and has been added to it.
      #
      # The lesson is that "the majority size" is not "the only size". Both cat
      # and lib were visible in the same table that produced the wrong
      # conclusion; the size histogram was read for its mode instead of for its
      # variants.
      - [0x19C0, .data, e_misc]          # 0xB4
      - [0x1A74, data]
      - [0x1CB8, .data, e_particles]     # 0x80
      # e_room_fg, shimmed 2026-08-02. 0x1D38..0x1DC4 = 0x8C, the size all 18
      # peers that declare this segment use.
      #
      # RETRACTION of the note that used to sit lower in this file. It claimed
      # rno0's slot was 0x78 (five ObjInit entries) against a header that emits
      # 0x8C, and concluded the file "must stay assembly". Two errors:
      #
      #   1. 0x78 is SIX ObjInit entries (6 * 0x14), not five, and it was
      #      measured from D_us_80181D4C, which is where the ObjInit array
      #      starts. The header declares five 4-byte anim tables FIRST, so the
      #      file's data actually begins 0x14 earlier, at 0x1D38 -- an address
      #      this config already had as a raw `data` segment.
      #   2. The claim that e_floor_trap and e_thornweed_corpseweed reference
      #      0x1DC4/0x1DD4 "inside what the header would claim" was an
      #      off-by-one. 0x1DC4 is the EXCLUSIVE end of this segment, so both
      #      references land outside it.
      #
      # The lesson: a segment's start is the first thing the FILE emits, not the
      # first thing its code happens to name.
      - [0x1D38, .data, e_room_fg]       # 0x8C
      # e_floor_trap, shimmed 2026-08-16 when src/st/e_floor_trap.h was adopted
      # from upstream. The header's only file-scope data is `anim[]`, 7
      # AnimateEntityFrame entries = 0x10 after padding, and upstream declares
      # exactly [0x1DC4, .data, e_floor_trap] followed by
      # [0x1DD4, .data, e_thornweed_corpseweed]. Splitting only the first 0x10
      # off the blob leaves the rest raw, so the three files after it
      # (thornweed, stone_skull, jack_o_bones) are untouched until each is
      # shimmed in turn.
      - [0x1DC4, .data, e_floor_trap]   # 0x10
      - [0x1DD4, data]
      # e_hammer / e_gurkha / e_blade, shimmed 2026-08-02 once the shared
      # headers gained GIANTBRO_ZPRIORITY_ADJUST. Starts are the minimum data
      # address each file's assembly references; sizes are confirmed three ways
      # (no2 and np3 both declare 0x57C / 0x4F0 / 0x698, and the derived starts
      # reproduce them: 0x26A0-0x2124 = 0x57C, 0x2B90-0x26A0 = 0x4F0).
      - [0x2124, .data, e_hammer]        # 0x57C
      - [0x26A0, .data, e_gurkha]        # 0x4F0
      - [0x2B90, .data, e_blade]         # 0x698
      - [0x3228, data]
      # (The note that stood here declaring e_room_fg unshimmable is retracted.
      # It was shimmed 2026-08-02 with no header change at all; see the segment
      # at 0x1D38 above for what the note got wrong.)
      - [0x3354, .data, e_medusa_head]   # 0x78
      - [0x33CC, data]
      # NOTE these three are placed by REFERENCE ORDER, not by byte matching:
      # e_room_fg/e_misc/e_collect have stage-dependent data (79 conditionals in
      # e_collect.h alone) so find_data_segment.py correctly refuses them. splat
      # emits a file's .data in its text order, so each segment starts at the
      # minimum data address that file's own assembly references. The rule
      # reproduces the already-declared e_particles (0x1CB8) and e_medusa_head
      # (0x3354) exactly. Sizes are the peer variant that lands on the next
      # file's first reference; the peer-MAJORITY size overlaps in all three
      # cases. See docs/P3b-rno0-remaining-data-segments.md.
      - [0x35B00, .rodata, e_red_door]
      - [0x35B18, .rodata, e_collect]
      - [0x35BEC, .rodata, e_clock_room]
      - [0x35C2C, .rodata, e_armor_lord_guardian]
      - [0x35CE8, .rodata, e_stage_name]
      - [0x35D1C, .rodata, e_floor_trap]
      - [0x35D28, .rodata, e_thornweed_corpseweed]
      - [0x35D64, .rodata, e_stone_skull]
      - [0x35D70, .rodata, unk_48100]
      - [0x35DD0, .rodata, giantbro_helpers]
      - [0x35E30, .rodata, e_hammer]
      - [0x35EDC, .rodata, e_gurkha]
      - [0x35FC8, .rodata, e_blade]
      - [0x36048, .rodata, e_subweapon_container]
      - [0x36054, .rodata, unk_4F968]
      - [0x36200, .rodata, e_medusa_head]
      - [0x36208, .rodata, unk_5289C]
      - [0x36220, .rodata, prim_helpers]
      - [0x36228, c, e_room_bg]
      - [0x36328, c, e_lock_camera]
      - [0x364E4, c, e_breakable]
      - [0x36654, c, e_elevator]
      - [0x36E58, c, e_background_clock_pendulum]
      - [0x37104, c, func_us_801b7104]
      - [0x37324, c, st_update]
      - [0x37758, c, collision]
      - [0x38F14, c, create_entity]
      # Renamed, NOT resized. This segment was always e_red_door.c: its span
      # 0x39A8C..0x3A73C is 0xCB0, byte-identical to rcen's e_red_door segment
      # (0x22BD4..0x23884). The old `unk_39A8C` name was the only thing
      # standing between rno0 and the shared header.
      - [0x39A8C, c, e_red_door]
      - [0x3A73C, c, st_common]
      - [0x3BBEC, c, e_collect]
      - [0x3E55C, c, e_misc]
      - [0x408F8, c, e_background_pillars]
      - [0x40C54, c, e_clock_room]
      - [0x42340, c, e_armor_lord_guardian]
      - [0x4499C, c, e_stage_name]
      - [0x457F0, c, e_particles]
      - [0x46034, c, e_room_fg]
      - [0x46120, c, popup]
      - [0x46450, c, e_floor_trap]
      - [0x469FC, c, e_thornweed_corpseweed]
      - [0x47F24, c, e_stone_skull]
      - [0x48100, c, unk_48100]
      - [0x4992C, c, giantbro_helpers]
      # Split 2026-08-01 at the upstream file boundary. giantbro_helpers.h ends
      # at func_801CDFD8; no2/4966C.c and np3/4E04C.c begin at func_801CE04C,
      # which in rno0 lives at 0x4A320 (the 0x801CExxx in the symbol names is
      # no2/np3's address, not this overlay's).
      - [0x4A320, c, unk_4A320]
      - [0x4A7A0, c, e_hammer]
      - [0x4BA58, c, e_gurkha]
      - [0x4CCEC, c, e_blade]
      - [0x4E230, c, e_subweapon_container]
      - [0x4EB40, c, e_gorgon]
      - [0x4F968, c, unk_4F968]
      - [0x524C8, c, e_medusa_head]
      - [0x5289C, c, unk_5289C]
      - [0x53688, c, prim_helpers]
      # Segmented 2026-08-01 so shared implementations can be shimmed. Sizes
      # are 0x10 + 0xC00 + 0xC4 = 0xCD4, exactly the bss size in strno0.map.
      # Same shape as config/splat.us.stnp3.yaml, which is the working
      # reference for this overlay's layout.
      - [0x53EB8, .bss, create_entity]
      - [0x53EC8, .bss, bss]
      # giantbro_helpers.h emits exactly 0x7C: five s32 debug vars (0x14) plus
      # STATIC_PAD_BSS(104). Confirmed against splat.us.stnp3.yaml, where the
      # same segment spans 0x53378..0x533F4 = 0x7C.
      - [0x54AC8, .bss, giantbro_helpers]
      # IDENTIFIED 2026-08-02. The old note here guessed that this whole 0x48
      # "belongs to some other file", and that np3 attributes the equivalent
      # region to st_update. Half right: only the TAIL is st_update's.
      #
      # asm/us/st/rno0/data/54B44.bss.s labels it exactly:
      #     0x54B44  D_us_801D4B44   0x4
      #     0x54B48  g_Statues       0x4   (two shorts, used by e_clock_room.h)
      #     0x54B4C  D_us_801D4B4C   0x40  (16 words, runs to 0x54B8C)
      #
      # That trailing 0x40 is precisely what src/st/st_update.h emits as
      # uninitialised static storage, so it is st_update's and the split goes
      # AFTER g_Statues, not before it.
      #
      # g_Statues must keep 0x801D4B48: e_clock_room.c shims a header that
      # references it, so that address is encoded in already-matching code.
      # Moving st_update to the front of this region would break six matched
      # clock-room functions.
      - [0x54B44, bss]                # 0x8: D_us_801D4B44 + g_Statues
      - [0x54B4C, .bss, st_update]    # 0x40
  - [0x54B8C]
