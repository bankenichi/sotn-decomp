    align: 4
    subalign: 4
    subsegments:
      - [0x0, .data, header]
      - [0x2C, data]
      - [0x8FC, .data, e_init]
      - [0xC18, .data, e_room_bg]
      - [0xE20, data]
      # Located by automation/find_data_segment.py, which calibrates against a
      # peer whose address its config already declares before trusting a hit.
      # Cross-check: st_update 0x1048..0x1094, collision 0x1094..0x1454 and
      # e_red_door 0x1454 tile with no gaps, in `c` segment order.
      - [0x1048, .data, st_update]    # 0x4C
      # collision.h's g_testCollEnemyLookup / g_testCollLuckCutoff. Selected by
      # VERSION rather than by stage, hence identical in every us overlay and
      # cleanly calibrated against cen, dre and lib.
      - [0x1094, .data, collision]    # 0x3C0, abuts e_red_door at 0x1454
      # g_eRedDoorUV, 3 rows of 8 bytes. `static` in src/st/e_red_door.h, so
      # the compiled e_red_door.c must emit it and splat must NOT. Located by
      # searching RNO0.BIN for the initialiser's 24-byte signature; the same
      # search on RCEN.BIN returns 0xE78, which is what rcen's config already
      # declares, so the method was validated against a known answer first.
      # EntityRedDoor.s independently references D_us_80181454.
      - [0x1454, .data, e_red_door]   # 0x18
      - [0x146C, data]
      # Both located by automation/find_data_segment.py and calibrated against
      # peers whose configs already declare the address. Neither header
      # declares uninitialised storage, so unlike st_update these need no
      # matching .bss segment; that was checked before building.
      - [0x1CB8, .data, e_particles]     # 0x80
      - [0x1D38, data]
      - [0x3354, .data, e_medusa_head]   # 0x78
