      - [0x4A320, c, unk_4A320]
      - [0x4A7A0, c, e_hammer]
      - [0x4BA58, c, e_gurkha]
      - [0x4CCEC, c, e_blade]
      - [0x4E230, c, e_subweapon_container]
      - [0x4EB40, c, e_gorgon]
      - [0x4F968, c, unk_4F968]
      - [0x524C8, c, e_medusa_head]
      - [0x5289C, c, unk_5289C]
      - [0x53688, c, prim_helpers]
      # Segmented 2026-08-01 so shared implementations can be shimmed. Sizes
      # are 0x10 + 0xC00 + 0xC4 = 0xCD4, exactly the bss size in strno0.map.
      # Same shape as config/splat.us.stnp3.yaml, which is the working
      # reference for this overlay's layout.
      - [0x53EB8, .bss, create_entity]
      - [0x53EC8, .bss, bss]
      # giantbro_helpers.h emits exactly 0x7C: five s32 debug vars (0x14) plus
      # STATIC_PAD_BSS(104). Confirmed against splat.us.stnp3.yaml, where the
      # same segment spans 0x53378..0x533F4 = 0x7C.
      - [0x54AC8, .bss, giantbro_helpers]
      # IDENTIFIED 2026-08-02. The old note here guessed that this whole 0x48
      # "belongs to some other file", and that np3 attributes the equivalent
      # region to st_update. Half right: only the TAIL is st_update's.
      #
      # asm/us/st/rno0/data/54B44.bss.s labels it exactly:
      #     0x54B44  D_us_801D4B44   0x4
      #     0x54B48  g_Statues       0x4   (two shorts, used by e_clock_room.h)
      #     0x54B4C  D_us_801D4B4C   0x40  (16 words, runs to 0x54B8C)
      #
      # That trailing 0x40 is precisely what src/st/st_update.h emits as
      # uninitialised static storage, so it is st_update's and the split goes
      # AFTER g_Statues, not before it.
      #
      # g_Statues must keep 0x801D4B48: e_clock_room.c shims a header that
      # references it, so that address is encoded in already-matching code.
      # Moving st_update to the front of this region would break six matched
      # clock-room functions.
      - [0x54B44, bss]                # 0x8: D_us_801D4B44 + g_Statues
      - [0x54B4C, .bss, st_update]    # 0x40
  - [0x54B8C]
